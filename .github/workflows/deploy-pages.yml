name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test crawler safety checks
        run: npm run test:crawler

      - name: Collect current HUFS courses
        run: node crawler/crawl.mjs --campus all --delay-ms 350 --output-dir crawler/data

      - name: Validate and publish refreshed data
        run: |
          node crawler/validate.mjs crawler/data --strict
          node crawler/promote.mjs crawler/data public/data

      - name: Build and verify static site
        run: npm run test:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
